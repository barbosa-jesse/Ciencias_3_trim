<style>
/* Skip artifact shell — fixed styles served beside every artifact.
   Tokens, utilities and components (basecoat 1.0 markup, no CDN); artifacts
   override --accent for their own identity. */
:root {
  color-scheme: light dark;
  --accent: #2563eb;
  --accent-contrast: #ffffff;
  --accent-text: color-mix(in srgb, var(--accent) 72%, #000);
  --bg: #f8f9fb;
  --surface: #ffffff;
  --text: #14171f;
  --text-muted: #5b6472;
  --border: rgba(20, 23, 31, 0.10);
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20, 23, 31, 0.08);
  --space: 16px;
  --success: #0a7a35;
  --danger: #c0262d;
  --warning: #8a5300;
}
/* Theme resolution. Without data-theme the viewer's system preference decides,
   as it always did. With it, the artifact's own choice wins in BOTH directions:
   a page that hardcodes one palette must not be handed the opposite set of
   tokens by the machine it happens to be opened on. The dark values appear
   twice because a media query cannot be folded into a selector list.
   The attribute sits inside :where() so these blocks keep the specificity of a
   bare :root — the page's own <style> is linked after this file and must go on
   overriding any token it wants, exactly as it could before. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
    --bg: #101318;
    --surface: #181c23;
    --text: #eef1f6;
    --text-muted: #9aa4b2;
    --border: rgba(238, 241, 246, 0.12);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    --success: #4ade80;
    --danger: #f87171;
    --warning: #fbbf24;
  }
}
:root:where([data-theme="dark"]) {
  color-scheme: dark;
  --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
  --bg: #101318;
  --surface: #181c23;
  --text: #eef1f6;
  --text-muted: #9aa4b2;
  --border: rgba(238, 241, 246, 0.12);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;
}
:root:where([data-theme="light"]) { color-scheme: light; }
/* Pages generated before the shell had its own components still link the
   basecoat CDN, which reads its own tokens and switches theme only on a
   .dark class. Bridged to the shell's, whatever of it those pages use takes
   the page's accent and follows the declared theme. Its --accent token is a
   hover tint, renamed in its theme as --color-accent; the shell's --accent is
   the brand colour, so the tint is derived from it here. */
:root {
  --background: var(--bg);
  --foreground: var(--text);
  --card: var(--surface);
  --card-foreground: var(--text);
  --popover: var(--surface);
  --popover-foreground: var(--text);
  --primary: var(--accent);
  --primary-foreground: var(--accent-contrast);
  --secondary: color-mix(in srgb, var(--text) 7%, var(--surface));
  --secondary-foreground: var(--text);
  --muted: color-mix(in srgb, var(--text) 5%, var(--surface));
  --muted-foreground: var(--text-muted);
  --color-accent: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --color-accent-foreground: var(--text);
  --destructive: var(--danger);
  --input: var(--border);
  --ring: var(--accent);
}
* { box-sizing: border-box; }

*, ::before, ::after, ::backdrop { margin: 0; padding: 0; border: 0 solid; }

.hidden { display: none !important; }

a { color: inherit; text-decoration: inherit; }

svg, video, canvas, iframe { display: block; vertical-align: middle; }

.kpi { display: flex; flex-direction: column; gap: 4px; }

  color: var(--text-muted); font-weight: 600;

.chart-box { width: 100%; min-height: 220px; }

.chart-legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

.muted { color: var(--text-muted); }
.accent { color: var(--accent-text); }
.shell-badge, .eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent-text);
}

.shell-badge, .eyebrow, .badge { width: fit-content; max-width: 100%; }

@media (prefers-reduced-motion: no-preference) {
  .shell-fade { animation: shell-fade 400ms ease both; }
  @keyframes shell-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: var(--space); }
.between { justify-content: space-between; }

}

<script>
/* Skip artifact shell — fixed helpers served beside every artifact. */
(function () {
  "use strict";

  var fmt = {
    num: function (v, opts) { return new Intl.NumberFormat("pt-BR", opts || {}).format(v); },
    brl: function (v) { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v); },
    pct: function (v) { return new Intl.NumberFormat("pt-BR", { style: "percent", maximumFractionDigits: 1 }).format(v); },
    compact: function (v) { return new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 }).format(v); },
    brlCompact: function (v) { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: 1 }).format(v); }
  };

  // axisLabels formats the five y-axis ticks in the unit the chart declared
  // (percent, BRL or plain numbers), compact so long values never clip, with
  // the fewest decimals that still print every tick exactly (1,5 mi, not 2 mi).
  function axisLabels(format, ticks) {
    function at(digits) {
      var opts = { notation: "compact", maximumFractionDigits: digits };
      if (format === "pct") opts = { style: "percent", maximumFractionDigits: digits };
      else if (format === "brl") opts = { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: digits };
      var nf = new Intl.NumberFormat("pt-BR", opts);
      return ticks.map(function (t) { return nf.format(t); });
    }
    for (var digits = 0; digits < 2; digits++) {
      if (at(digits).join("|") === at(digits + 1).join("|")) return at(digits);
    }
    return at(2);
  }

  // yAxisPad formats the ticks and measures the left padding they need from
  // the longest one; drawYAxis then draws the grid and the labels.
  function yAxisPad(format, max) {
    var labels = axisLabels(format, [0, max / 4, max / 2, (max * 3) / 4, max]);
    var longest = labels.reduce(function (m, l) { return Math.max(m, l.length); }, 0);
    return { labels: labels, padL: Math.max(40, Math.round(longest * 6.2) + 14) };
  }
  function drawYAxis(svg, axis, W, padR, padT, plotH) {
    for (var g = 0; g <= 4; g++) {
      var gy = padT + plotH - (plotH * g) / 4;
      svg.appendChild(svgEl("line", { x1: axis.padL, y1: gy, x2: W - padR, y2: gy, stroke: "currentColor", "stroke-opacity": 0.08 }));

      lbl.textContent = axis.labels[g];
      svg.appendChild(lbl);
    }
  }

  // xLabelStep: show every k-th category label so labels never overlap, and
  // always the last one (counted back from the end).
  function xLabelStep(labels, step) {
    var longest = labels.reduce(function (m, l) { return Math.max(m, String(l).length); }, 0);
    return Math.max(1, Math.ceil((longest * 6.4 + 8) / Math.max(step, 1)));

    var anchor = "middle";
    var half = String(text).length * 3.2;
    if (edgeGuard && x - half < 4) anchor = "start";
    if (edgeGuard && x + half > W - 4) anchor = "end";
    var tx = svgEl("text", { x: x, y: y, "text-anchor": anchor, "font-size": 11, fill: mutedColor() });
    tx.textContent = text;
    svg.appendChild(tx);
  }
  // categoryLines fits a bar's category name in its slot: one line, two lines
  // split at a space, or cut with "…". A bar without its name can't be read, so
  // categories are never skipped; null when the slot is too narrow for that.
  function categoryLines(text, slot) {
    var fit = Math.floor((slot - 6) / 6.4);
    var s = String(text);
    if (fit < 4) return null;
    if (s.length <= fit) return [s];
    var cut = function (t) { return t.length <= fit ? t : t.slice(0, fit - 1).trimEnd() + "…"; };
    var best = -1;
    for (var i = 0; i < s.length; i++) {
      if (s[i] === " " && (best < 0 || Math.abs(s.length / 2 - i) < Math.abs(s.length / 2 - best))) best = i;
    }
    if (best < 0) return [cut(s)];
    return [cut(s.slice(0, best)), cut(s.slice(best + 1))];
  }
  function legend(el, items) {
    var box = document.createElement("div");
    box.className = "chart-legend";
    items.forEach(function (it) {
      var row = document.createElement("span");
      var dot = document.createElement("i");
      dot.style.background = it.color;
      row.appendChild(dot);
      row.appendChild(document.createTextNode((it.label || "") + (it.value ? " " : "")));
      if (it.value) {
        var v = document.createElement("b");
        v.textContent = it.value;
        row.appendChild(v);
      }
      box.appendChild(row);
    });
    resolve(el).appendChild(box);
  }
  var seriesPalette = ["#1baf7a", "#eda100", "#e34948", "#4a3aa7", "#e87ba4", "#0ea5b7"];

  // format accepts a function OR one of the fmt names ("num" | "brl" | "pct").
  // A page's function may return nothing or throw: the chart prints its
  // number instead of taking the rest of the page script down with it.
  function coerceFormat(spec) {
    if (typeof spec === "function") {
      return function (v) {
        try {
          var out = spec(v);
          return out == null ? "" : String(out);
        } catch (e) {
          return fmt.num(v);
        }
      };
    }
    if (typeof spec === "string" && fmt[spec]) return fmt[spec];
    return function (v) { return fmt.num(v); };
  }

  function accent() {
    return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2563eb";
  }
  function mutedColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#5b6472";
  }
  function svgEl(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function frame(el, w, h) {
    var svg = svgEl("svg", { viewBox: "0 0 " + w + " " + h, role: "img" });
    el = resolve(el);
    el.innerHTML = "";
    el.appendChild(svg);
    return svg;
  }

  // maxOf guards the axis scale: empty values would give -Infinity (truthy,
  // so "|| 1" can't catch it) and a non-positive max would flip the chart.
  // finite reads a chart value as a number, 0 when it is not one (NaN,
  // Infinity, a stray string), so one bad value cannot blank the axis.
  function finite(v) {
    var n = +v;
    return isFinite(n) ? n : 0;
  }

  function maxOf(values) {
    var m = values.length ? Math.max.apply(null, values.map(finite)) : 0;
    return m > 0 ? m : 1;
  }

  // labelsFor pads or trims the category names to the n points drawn: pages
  // pass labels and values of different lengths, and one throw here loses
  // every section the page renders after the chart.
  function labelsFor(cfg, n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(cfg.labels && cfg.labels[i] != null ? String(cfg.labels[i]) : "");
    return out;
  }

  // niceMax rounds the scale up so the four grid steps land on round values
  // (1, 1.5, 2, 2.5, 3, 4, 5, 6 or 8 × 10^k) and the tick labels read exactly.
  function niceMax(max) {
    var raw = max / 4;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var res = raw / mag;
    var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    var nice = steps.filter(function (s) { return s >= res - 1e-9; })[0];
    return nice * mag * 4;
  }

  // bar(el, {labels:[], values:[], color?, format?}) — vertical bar chart.
  function bar(el, cfg) {
    var W = 640, H = 280, padB = 30, padT = 12, padR = 12;
    var max = niceMax(maxOf(cfg.values));
    var axis = yAxisPad(cfg.format, max);
    var svg = frame(el, W, H);
    var n = cfg.values.length;
    var labels = labelsFor(cfg, n);
    var plotW = W - axis.padL - padR;
    var step = plotW / n, bw = Math.min(step * 0.62, 64);
    var names = labels.map(function (l) { return categoryLines(l, step); });
    var named = names.every(Boolean);
    if (named && names.some(function (l) { return l.length > 1; })) padB = 42;
    var plotH = H - padT - padB;
    var color = cfg.color || accent();
    var f = coerceFormat(cfg.format);
    var every = xLabelStep(labels, step);
    drawYAxis(svg, axis, W, padR, padT, plotH);
    cfg.values.forEach(function (v, i) {
      var bh = Math.max(0, (finite(v) / max) * plotH);
      var x = axis.padL + i * step + (step - bw) / 2;
      var y = padT + plotH - bh;
      var r = svgEl("rect", { x: x, y: y, width: bw, height: bh, rx: 4, fill: (cfg.colors && cfg.colors[i]) || color });
      var t = svgEl("title", {});
      t.textContent = labels[i] + ": " + f(v);
      r.appendChild(t);
      svg.appendChild(r);
      if (named) {
        names[i].forEach(function (text, li) {
          drawXLabel(svg, text, x + bw / 2, padT + plotH + 18 + li * 13, W, false);
        });
      } else if ((n - 1 - i) % every === 0) {
        drawXLabel(svg, labels[i], x + bw / 2, H - 10, W, false);
      }
    });
  }

  // line(el, {labels:[], values:[] | series:[{label, values, color?}], color?, format?})
  // — one line, or several series on one scale with a legend under the chart.
  function line(el, cfg) {
    var W = 640, H = 280, padB = 30, padT = 12, padR = 16;
    var series = cfg.series && cfg.series.length
      ? cfg.series
      : [{ label: "", values: cfg.values || [], color: cfg.color }];
    var all = [];
    series.forEach(function (s) { all = all.concat(s.values || []); });
    var max = niceMax(maxOf(all));
    var axis = yAxisPad(cfg.format, max);
    var svg = frame(el, W, H);
    var n = series.reduce(function (m, s) { return Math.max(m, (s.values || []).length); }, 0);
    var labels = labelsFor(cfg, n);
    var plotW = W - axis.padL - padR, plotH = H - padT - padB;
    var f = coerceFormat(cfg.format);
    drawYAxis(svg, axis, W, padR, padT, plotH);
    var xs = labels.map(function (_, i) { return axis.padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1)); });
    var every = xLabelStep(labels, n > 1 ? plotW / (n - 1) : plotW);
    labels.forEach(function (label, i) {
      if ((n - 1 - i) % every === 0) drawXLabel(svg, label, xs[i], H - 10, W, true);
    });
    var colors = series.map(function (s, si) {
      return s.color || (si === 0 ? (cfg.color || accent()) : seriesPalette[(si - 1) % seriesPalette.length]);
    });
    series.forEach(function (s, si) {
      var color = colors[si];
      var pts = (s.values || []).map(function (v, i) { return [xs[i], padT + plotH - (finite(v) / max) * plotH]; });
      var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
      svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
      pts.forEach(function (p, i) {
        var c = svgEl("circle", { cx: p[0], cy: p[1], r: 3.5, fill: color });
        var t = svgEl("title", {});
        t.textContent = (s.label ? s.label + " · " : "") + labels[i] + ": " + f(s.values[i]);
        c.appendChild(t);
        svg.appendChild(c);
      });
    });
    if (series.length > 1) {
      legend(el, series.map(function (s, si) { return { label: s.label, color: colors[si] }; }));
    }
  }

  // donut(el, {labels:[], values:[], colors?, format?, center?, centerLabel?, legend?})
  // — donut with a short total in the centre (compact, in the declared unit)
  // and, with legend: true, the labels and shares listed under it.
  function donut(el, cfg) {
    var W = 320, H = 280, cx = W / 2, cy = H / 2, R = 92, r = 58;
    var svg = frame(el, W, H);
    // At 100% of a wide container the donut outgrows the height pages give
    // the box and spills over the next section: keep it at its own size.
    svg.style.maxWidth = W + "px";
    svg.style.margin = "0 auto";
    var values = cfg.values.map(finite);
    var labels = labelsFor(cfg, values.length);
    var sum = values.reduce(function (a, b) { return a + b; }, 0);
    var total = sum || 1;
    var palette = cfg.colors || [accent()].concat(seriesPalette);
    // The hover keeps the full value; the centre has room for a short one.
    var full = coerceFormat(cfg.format);
    var short = typeof cfg.format === "function" ? full : cfg.format === "brl" ? fmt.brlCompact : fmt.compact;
    var a0 = -Math.PI / 2;
    values.forEach(function (v, i) {
      var a1 = a0 + (v / total) * Math.PI * 2;
      var large = a1 - a0 > Math.PI ? 1 : 0;
      var p = ["M", cx + R * Math.cos(a0), cy + R * Math.sin(a0),
        "A", R, R, 0, large, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
        "L", cx + r * Math.cos(a1), cy + r * Math.sin(a1),
        "A", r, r, 0, large, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), "Z"].join(" ");
      var path = svgEl("path", { d: p, fill: palette[i % palette.length] });
      var t = svgEl("title", {});
      t.textContent = labels[i] + ": " + full(v) + " (" + fmt.pct(v / total) + ")";
      path.appendChild(t);
      svg.appendChild(path);
      a0 = a1;
    });
    // A share chart has no total worth printing: without its own centre text
    // the caption alone takes the middle.
    var text = cfg.center != null ? String(cfg.center) : (cfg.format === "pct" ? "" : short(sum));
    if (text) {
      var size = text.length > 9 ? 14 : text.length > 7 ? 17 : 20;
      var center = svgEl("text", { x: cx, y: cfg.centerLabel ? cy + 1 : cy + 6, "text-anchor": "middle", "font-size": size, "font-weight": 650, fill: "currentColor" });
      center.textContent = text;
      svg.appendChild(center);
    }
    if (cfg.centerLabel) {
      var cap = svgEl("text", { x: cx, y: text ? cy + 19 : cy + 5, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
      cap.textContent = cfg.centerLabel;
      svg.appendChild(cap);
    }
    if (cfg.legend) {
      legend(el, labels.map(function (label, i) {
        return { label: label, color: palette[i % palette.length], value: fmt.pct(values[i] / total) };
      }));
    }
  }

  // ---- Page building blocks: what dashboards and small systems kept
  // re-implementing — a searchable sortable table, a KPI row, tabs, toasts,
  // dialogs, saved state and mock data. Every call is opt-in, so a page that
  // brings its own versions keeps them.

  function resolve(target) {
    return typeof target === "string" ? document.querySelector(target) : target;
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text != null) el.textContent = text;
    return el;
  }

  function isNumberColumn(col) {
    return col.align === "right" || col.format === "num" || col.format === "brl" || col.format === "pct";
  }

  function cellText(col, row) {
    var value = row[col.key];
    if (value == null) return "";
    return col.format ? coerceFormat(col.format)(value) : String(value);
  }

  function compareValues(a, b) {
    if (typeof a === "number" && typeof b === "number") return a - b;
    return String(a == null ? "" : a).localeCompare(String(b == null ? "" : b), "pt-BR", { numeric: true });
  }

  // table(el, {columns, rows, search?, pageSize?, empty?, onRowClick?}) — a
  // table.shell-table with sortable headers, an optional search box and
  // pager. A column is {key, label, format?, align?, sortable? (true),
  // render?(value, row) returning a Node or an HTML string — the page writes
  // its cell templates as markup}. Plain values are always set as text.
  // Returns {setRows, rows}.
  function table(target, cfg) {
    var root = resolve(target);
    var cols = cfg.columns || [];
    var pageSize = cfg.pageSize || 0;
    var state = { rows: (cfg.rows || []).slice(), query: "", key: null, dir: 1, page: 0 };
    root.innerHTML = "";
    if (cfg.search) {
      var search = node("input", "input skip-table-search");
      search.type = "search";
      search.placeholder = typeof cfg.search === "string" ? cfg.search : "Buscar…";
      search.setAttribute("aria-label", search.placeholder);
      search.addEventListener("input", function () {
        state.query = search.value.trim().toLowerCase();
        state.page = 0;
        draw();
      });
      root.appendChild(search);
    }
    var tableEl = node("table", "shell-table");
    var headRow = node("tr");
    var heads = cols.map(function (col) {
      var th = node("th", isNumberColumn(col) ? "num" : "", col.label == null ? col.key : col.label);
      th.scope = "col";
      if (col.sortable !== false) {
        var toggle = function () {
          state.dir = state.key === col.key ? -state.dir : 1;
          state.key = col.key;
          draw();
        };
        th.setAttribute("data-sort", col.key);
        th.tabIndex = 0;
        th.addEventListener("click", toggle);
        th.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });
      }
      headRow.appendChild(th);
      return th;
    });
    var thead = node("thead");
    var tbody = node("tbody");
    var wrap = node("div", "skip-table-wrap");
    var pager = node("div", "skip-pager");
    thead.appendChild(headRow);
    tableEl.appendChild(thead);
    tableEl.appendChild(tbody);
    wrap.appendChild(tableEl);
    root.appendChild(wrap);
    if (pageSize) root.appendChild(pager);

    function visibleRows() {
      var rows = state.rows;
      if (state.query) {
        rows = rows.filter(function (row) {
          return cols.some(function (col) { return cellText(col, row).toLowerCase().indexOf(state.query) >= 0; });
        });
      }
      if (state.key) {
        var key = state.key, dir = state.dir;
        rows = rows.slice().sort(function (a, b) { return dir * compareValues(a[key], b[key]); });
      }
      return rows;
    }

    function drawRow(row) {
      var tr = node("tr");
      cols.forEach(function (col) {
        var td = node("td", isNumberColumn(col) ? "num" : "");
        if (!col.render) {
          td.textContent = cellText(col, row);
        } else {
          var content = col.render(row[col.key], row);
          if (content instanceof Node) td.appendChild(content);
          else td.innerHTML = content == null ? "" : String(content);
        }
        tr.appendChild(td);
      });
      // The row stays a row (no role) and takes focus, so a keyboard reaches
      // the same action; keys pressed on a control inside a cell are its own.
      if (cfg.onRowClick) {
        tr.style.cursor = "pointer";
        tr.tabIndex = 0;
        tr.addEventListener("click", function () { cfg.onRowClick(row); });
        tr.addEventListener("keydown", function (e) {
          if (e.target !== tr || (e.key !== "Enter" && e.key !== " ")) return;
          e.preventDefault();
          cfg.onRowClick(row);
        });
      }
      return tr;
    }

    function pagerButton(label, disabled, step) {
      var button = node("button", "btn", label);
      button.type = "button";
      button.setAttribute("data-variant", "outline");
      button.setAttribute("data-size", "sm");
      button.disabled = disabled;
      button.addEventListener("click", function () { state.page += step; draw(); });
      return button;
    }

    function draw() {
      var rows = visibleRows();
      heads.forEach(function (th, i) {
        if (cols[i].key === state.key) th.setAttribute("aria-sort", state.dir > 0 ? "ascending" : "descending");
        else th.removeAttribute("aria-sort");
      });
      var pages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      state.page = Math.min(state.page, pages - 1);
      var shown = pageSize ? rows.slice(state.page * pageSize, (state.page + 1) * pageSize) : rows;
      tbody.innerHTML = "";
      if (!shown.length) {
        var empty = node("td", "skip-table-empty", cfg.empty || "Nenhum registro encontrado.");
        empty.colSpan = cols.length;
        tbody.appendChild(node("tr")).appendChild(empty);
      }
      shown.forEach(function (row) { tbody.appendChild(drawRow(row)); });
      if (!pageSize) return;
      pager.innerHTML = "";
      var from = rows.length ? state.page * pageSize + 1 : 0;
      pager.appendChild(node("span", "", from + "–" + Math.min(rows.length, (state.page + 1) * pageSize) + " de " + rows.length));
      var nav = node("div", "row gap-2");
      nav.appendChild(pagerButton("Anterior", state.page === 0, -1));
      nav.appendChild(pagerButton("Próxima", state.page >= pages - 1, 1));
      pager.appendChild(nav);
    }

    draw();
    return {
      setRows: function (rows) { state.rows = rows.slice(); draw(); },
      rows: visibleRows
    };
  }

  // kpis(el, [{label, value, format?, delta?, hint?}]) — KPI cards in a
  // responsive grid; delta is a fraction (0.12 renders as ▲ 12%).
  function kpis(target, items) {
    var root = resolve(target);
    root.innerHTML = "";
    root.classList.add("shell-grid");
    items.forEach(function (item) {
      var card = node("div", "panel kpi");
      card.appendChild(node("span", "kpi-label", item.label));
      // Large money values go compact ("R$ 27,5 mi"): the full amount does
      // not fit a KPI card at four per row.
      var kpiFormat = item.format === "brl" && Math.abs(item.value) >= 1e6 ? fmt.brlCompact : (item.format ? coerceFormat(item.format) : null);
      card.appendChild(node("span", "kpi-value", kpiFormat ? kpiFormat(item.value) : String(item.value)));
      if (typeof item.delta === "number") {
        var up = item.delta >= 0;
        card.appendChild(node("span", "kpi-delta " + (up ? "up" : "down"), (up ? "▲ " : "▼ ") + fmt.pct(Math.abs(item.delta))));
      }
      if (item.hint) card.appendChild(node("span", "kpi-label", item.hint));
      root.appendChild(card);
    });
  }

  // badge(text, variant?) — a .badge node for table cells and lists;
  // variant is "secondary" | "outline" | "destructive" (default: primary).
  function badge(text, variant) {
    var el = node("span", "badge", text);
    if (variant) el.setAttribute("data-variant", variant);
    return el;
  }

  // tabs(el) — wires one .tabs block: [role=tab] buttons inside
  // [role=tablist], each with aria-controls naming its [role=tabpanel].
  function tabs(target) {
    var root = resolve(target);
    var buttons = Array.prototype.slice.call(root.querySelectorAll('[role="tab"]'));
    function select(chosen) {
      buttons.forEach(function (b) {
        var on = b === chosen;
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.tabIndex = on ? 0 : -1;
        var panel = document.getElementById(b.getAttribute("aria-controls"));
        if (panel) panel.hidden = !on;
      });
    }
    buttons.forEach(function (b, i) {
      b.addEventListener("click", function () { select(b); });
      b.addEventListener("keydown", function (e) {
        var step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!step) return;
        var next = buttons[(i + step + buttons.length) % buttons.length];
        next.focus();
        select(next);
      });
    });
    select(buttons.filter(function (b) { return b.getAttribute("aria-selected") === "true"; })[0] || buttons[0]);
  }

  // toast(message, {type?: "success" | "error", title?, duration?}) — a
  // .toast in a shared .toaster at the bottom of the page.
  function toast(message, opts) {
    opts = opts || {};
    var toaster = document.querySelector(".toaster") || document.body.appendChild(node("div", "toaster"));
    var item = node("div", "toast");
    item.setAttribute("role", opts.type === "error" ? "alert" : "status");
    item.setAttribute("aria-hidden", "true");
    if (opts.type) item.setAttribute("data-type", opts.type);
    var content = node("div", "toast-content");
    var section = node("section");
    if (opts.title) section.appendChild(node("h2", "", opts.title));
    section.appendChild(node("p", "", message));
    content.appendChild(section);
    item.appendChild(content);
    toaster.appendChild(item);
    requestAnimationFrame(function () { item.setAttribute("aria-hidden", "false"); });
    setTimeout(function () {
      item.setAttribute("aria-hidden", "true");
      setTimeout(function () { item.remove(); }, 400);
    }, opts.duration || 3000);
  }

  // Dialogs are native <dialog class="dialog">: a [data-dialog-open="id"]
  // anywhere opens one, a [data-dialog-close] inside closes it, and a click on
  // its backdrop closes it too. Plain dialog.showModal()/close() still work.
  document.addEventListener("click", function (e) {
    var target = e.target;
    if (!(target instanceof Element)) return;
    var opener = target.closest("[data-dialog-open]");
    if (opener) {
      var dialog = document.getElementById(opener.getAttribute("data-dialog-open"));
      if (dialog && dialog.showModal && !dialog.open) dialog.showModal();
      return;
    }
    var closer = target.closest("[data-dialog-close]");
    if (closer && closer.closest("dialog")) {
      closer.closest("dialog").close();
      return;
    }
    if (target.tagName === "DIALOG" && target.classList.contains("dialog") && target.open) target.close();
  });

  // store(key, fallback) — JSON state in localStorage that never throws (a
  // private window or a full quota falls back to memory): {get, set, update}.
  function store(key, fallback) {
    var memory;
    // Set while the last write did not reach localStorage: what is stored
    // there is older than memory until a write goes through again.
    var unsaved = false;
    var initial = function () { return fallback === undefined ? undefined : JSON.parse(JSON.stringify(fallback)); };
    function get() {
      if (!unsaved) {
        try {
          var raw = localStorage.getItem(key);
          if (raw != null) return JSON.parse(raw);
        } catch (e) { /* storage unavailable: memory below */ }
      }
      return memory !== undefined ? memory : initial();
    }
    function set(value) {
      memory = value;
      try {
        localStorage.setItem(key, JSON.stringify(value));
        unsaved = false;
      } catch (e) {
        unsaved = true;
      }
      return value;
    }
    return { get: get, set: set, update: function (fn) { return set(fn(get())); } };
  }

  // mock — seeded random data, so a page asks for 90 days of numbers in one
  // line instead of writing them out; the same seed gives the same data.
  var FIRST = ["Ana", "Bruno", "Carla", "Diego", "Eduarda", "Felipe", "Gabriela", "Henrique", "Isabela", "João",
    "Larissa", "Marcos", "Natália", "Otávio", "Paula", "Rafael", "Sofia", "Thiago", "Vanessa", "Lucas"];
  var LAST = ["Silva", "Santos", "Oliveira", "Souza", "Pereira", "Costa", "Rodrigues", "Almeida", "Nascimento", "Lima",
    "Araújo", "Fernandes", "Carvalho", "Gomes", "Martins", "Rocha", "Ribeiro", "Barbosa"];
  var INITIALS = "ABCDEFGHIJLMNOPRSTV".split("");
  var CITIES = ["São Paulo, SP", "Rio de Janeiro, RJ", "Belo Horizonte, MG", "Curitiba, PR", "Porto Alegre, RS",
    "Salvador, BA", "Recife, PE", "Fortaleza, CE", "Brasília, DF", "Goiânia, GO", "Campinas, SP", "Florianópolis, SC",
    "Manaus, AM", "Belém, PA", "Vitória, ES", "Natal, RN"];

  function createMock(seed) {
    var state = seed >>> 0;
    var names = 0;
    function random() {

{ m: 25, q: "Uma folha verde iluminada pela luz solar branca aparece verde porque:", o: ["A folha absorve todas as cores da luz branca e reflete apenas o verde", "A folha refrata a luz verde e absorve as demais cores", "A folha emite luz verde própria, como uma fonte primária", "A folha reflete todas as cores e absorve apenas o verde"], c: 0, h: "A cor que você vê é a cor que chega aos seus olhos. Se chega verde, o que aconteceu com as outras cores?", e: "A absorção retira algumas cores e devolve outras. A folha absorve quase tudo e reflete o verde. A alternativa d) inverte os papéis: se absorvesse só o verde, veríamos as outras cores." },

{ m: 25, q: "Quando a luz passa do ar para a água e muda de velocidade, dizemos que ocorreu:", o: ["Reflexão difusa", "Dispersão", "Absorção", "Refração"], c: 3, h: "O nome do fenômeno está ligado à mudança de meio e à mudança de velocidade.", e: "Refração é a mudança de velocidade ao atravessar a fronteira entre dois meios. Dispersão também envolve refração, mas só acontece com luz policromática." },

{ m: 25, q: "Ao meio-dia, num dia de sol, é possível ver faixas de luz entrando pelas janelas de uma estação de trem e atravessando o salão em linha reta, destacadas pela poeira no ar. O princípio da Óptica geométrica evidenciado é o da:", o: ["Reversibilidade dos raios de luz", "Independência dos raios de luz", "Propagação retilínea dos raios de luz", "Conservação da energia luminosa"], c: 2, h: "Observe o formato do caminho da luz na cena: o que ele desenha no espaço?", e: "A luz desenha uma trajetória reta em meio homogêneo, o que caracteriza a propagação retilínea. A reversibilidade trata do sentido invertido do caminho, não do formato dele." },
{ m: 25, q: "As fontes de luz monocromáticas se diferenciam das policromáticas porque:", o: ["Emitem luz de apenas uma cor, como o laser", "Emitem luz branca, composta por todas as cores", "Não precisam de um meio material para se propagar", "Só podem ser vistas em ambientes completamente escuros"], c: 0, h: "O prefixo 'mono' significa um. Pense no que isso diz sobre as cores emitidas.", e: "Monocromática significa uma só cor, como o laser verde. Policromática é a mistura de cores, como a luz do Sol, que o sistema visual interpreta como branca." },
{ m: 25, q: "Sobre as leis da reflexão, é correto afirmar que:", o: ["O ângulo de reflexão é sempre maior que o ângulo de incidência", "O ângulo de reflexão é sempre igual ao ângulo de incidência", "O raio incidente e o raio refletido ficam sempre em planos diferentes", "A reflexão só acontece em superfícies rugosas"], c: 1, h: "A segunda lei da reflexão compara duas medidas de ângulo. Elas são iguais ou diferentes?", e: "A segunda lei da reflexão diz que o ângulo de reflexão é sempre igual ao ângulo de incidência. A primeira lei diz que o raio incidente, o raio refletido e a reta normal estão no mesmo plano — o que torna a alternativa c) falsa." },
{ m: 25, q: "Ao passar do vácuo para a água, a velocidade da luz:", o: ["Aumenta, porque a água é mais densa", "Diminui, porque a presença de matéria reduz a velocidade", "Permanece exatamente igual", "Torna-se infinita"], c: 1, h: "No vácuo a luz atinge 300 mil km/s, a maior velocidade da natureza. O que acontece quando ela entra em um meio material?", e: "No vácuo a luz viaja a cerca de 300 mil km/s. Na água cai para cerca de 225 mil km/s, no vidro para 200 mil e no diamante para 120 mil. Quanto mais matéria no caminho, menor a velocidade." },
{ m: 26, q: "Uma lente de vidro cujas bordas são mais finas que o centro, imersa no ar, apresenta comportamento:", o: ["Divergente, pois espalha os raios", "Convergente, pois junta os raios num ponto", "Opaco, pois bloqueia a passagem da luz", "Refletor, pois devolve a luz como um espelho"], c: 1, h: "Bordas finas e centro espesso: para onde a luz é desviada? Pense no formato de uma lupa.", e: "Lentes de bordas finas, no ar, são convergentes e juntam os raios paralelos no foco. Bordas grossas é que são divergentes." },

{ m: 27, q: "Durante um eclipse lunar, a sombra que a Terra projeta na Lua é sempre circular. Essa observação sugere que a Terra é esférica porque:", o: ["Qualquer objeto, de qualquer formato, projeta sombra circular", "A esfera é o único corpo que projeta sombra circular em qualquer posição", "A Lua só pode receber sombras de corpos maiores que ela", "A sombra circular prova que a Terra está em movimento"], c: 1, h: "Um disco também projeta sombra circular, mas só numa posição. O que a esfera tem de diferente?", e: "A esfera projeta sombra circular em qualquer posição, e é isso que a observação constante do eclipse lunar revela. A alternativa a) é falsa: um cubo projeta sombra quadrada. Atenção: por isso a sombra é uma evidência indireta, e não uma prova sozinha." },
{ m: 27, q: "No experimento de Eratóstenes, ao meio-dia do solstício de verão, o poço de Siena ficava totalmente iluminado e as colunas de Alexandria projetavam sombra. Isso acontece porque:", o: ["A Terra é plana e o Sol estava mais próximo de Siena", "A superfície da Terra é curva, então os raios incidem perpendicularmente em Siena e inclinados em Alexandria", "As colunas de Alexandria eram feitas de material transparente", "A água do poço funcionava como espelho"], c: 1, h: "Se a Terra fosse plana e os raios fossem paralelos, a mesma cena seria vista nas duas cidades. A diferença revela o quê?", e: "A curvatura faz os raios paralelos do Sol atingirem as duas cidades com inclinações diferentes. É justamente essa diferença que permitiu calcular a circunferência." },
{ m: 27, q: "Quando um navio se afasta do porto, ele desaparece aos poucos: primeiro o casco, depois o corpo e por último o mastro. Se a Terra fosse plana, ele apenas ficaria menor, inteiro. Essa observação é uma evidência da:", o: ["Refração da luz na atmosfera", "Esfericidade da Terra", "Rotação da Terra", "Translação da Terra"], c: 1, h: "O navio não encolhe por inteiro: ele é escondido por algo. O que pode esconder a parte de baixo de um objeto?", e: "O casco é ocultado pela curvatura do planeta, o que evidencia a esfericidade. Refração na atmosfera poderia distorcer a imagem, mas não esconderia o casco primeiro." },

{ m: 27, q: "A forma da Terra é chamada de geoide porque:", o: ["É uma esfera perfeita, sem nenhuma irregularidade", "É quase esférica, levemente achatada nos polos e com irregularidades", "Tem formato de elipse, como a órbita que descreve", "É plana nas regiões polares e curva no equador"], c: 1, h: "Geoide não é o mesmo que esfera perfeita. A palavra indica algo parecido com a forma da Terra, mas não exato.", e: "Geoide é quase esférico, achatado nos polos e com irregularidades na superfície. Esfera perfeita é uma simplificação usada no estudo inicial." },
{ m: 27, q: "Aragorn conta que viajou até regiões distantes, onde as estrelas são estranhas, diferentes das que ele conhecia. Essa fala sugere que o mundo de Tolkien é esférico porque:", o: ["Em um mundo plano, o céu seria sempre igual em qualquer lugar", "As estrelas só podem ser vistas em planetas esféricos", "A mudança do céu prova que o mundo gira em torno do Sol", "Em mundos esféricos as estrelas ficam mais próximas do observador"], c: 0, h: "Se o chão fosse plano, o que você veria ao caminhar para longe? O céu mudaria?", e: "A curvatura impede ver o mesmo céu de pontos distantes, e é isso que explica as estrelas diferentes. A mudança do céu não diz nada sobre girar em torno do Sol." },
{ m: 27, q: "Os primeiros pensadores a propor e consolidar a ideia da esfericidade da Terra, na Grécia Antiga, foram:", o: ["Ptolomeu e Copérnico", "Newton e Galileu", "Pitágoras, Platão e Aristóteles", "Eratóstenes e Strabo"], c: 2, h: "Um deles propôs a teoria das esferas no século VI a.C.; os outros dois consolidaram a ideia no século IV a.C.", e: "Pitágoras propôs a teoria das esferas e Platão e Aristóteles a consolidaram. Eratóstenes e Strabo vieram depois, já com a ideia aceita, e contribuíram com medições e observações." },
{ m: 27, q: "Sobre a sombra circular da Terra projetada na Lua durante um eclipse lunar, é correto afirmar que:", o: ["É uma prova definitiva e sozinha de que a Terra é esférica", "É uma evidência indireta, porque outros objetos também podem projetar sombra circular em certa posição", "Não tem nenhuma relação com a forma da Terra", "Prova que a Terra está em movimento de rotação"], c: 1, h: "Lembra do experimento com a bola, o disco de papelão e a latinha? O disco também pode dar sombra redonda.", e: "A apostila chama de evidência indireta justamente porque um disco e uma latinha também podem projetar sombra circular em certa posição. A esfera é a única que faz isso em qualquer posição, mas a observação sozinha não basta como prova." },
{ m: 28, q: "A causa principal das estações do ano na Terra é:", o: ["A variação da distância entre a Terra e o Sol ao longo do ano", "A inclinação do eixo da Terra combinada ao movimento de translação", "A variação da quantidade de energia emitida pelo Sol a cada mês", "O movimento de rotação da Terra em torno do próprio eixo"], c: 1, h: "Se a distância fosse a causa, os dois hemisférios teriam a mesma estação ao mesmo tempo. Isso nunca acontece.", e: "A inclinação do eixo faz cada hemisfério receber insolação diferente ao longo da translação. A distância varia pouco e não explica estações opostas nos hemisférios." },
{ m: 28, q: "O movimento aparente do Sol, que parece nascer no Leste e se pôr no Oeste, é consequência da rotação da Terra no sentido:", o: ["De Leste para Oeste", "De Oeste para Leste", "Do Polo Norte para o Polo Sul", "Do Polo Sul para o Polo Norte"], c: 1, h: "O Sol parece ir de leste para oeste. Se a Terra girasse no mesmo sentido, o Sol pareceria ir para onde?", e: "A Terra gira de oeste para leste, e por isso o Sol parece percorrer o céu no sentido contrário. A alternativa a) descreve o movimento aparente, não o real." },
{ m: 28, q: "Uma pessoa sentada em um trem que se move a 50 km/h observa pela janela as árvores passando rapidamente. Sobre essa situação, é correto afirmar que a pessoa está em repouso em relação:", o: ["Às árvores do lado de fora", "Aos trilhos sob o trem", "Ao chão do vagão onde está sentada", "À estação que ficou para trás"], c: 2, h: "Repouso significa não mudar de posição em relação ao referencial escolhido. Em relação a qual dessas coisas a pessoa não se desloca?", e: "Em relação ao chão do vagão a pessoa não muda de posição, então está em repouso. Em relação às árvores, aos trilhos e à estação, ela se move a 50 km/h." },
{ m: 28, q: "O ano bissexto existe porque:", o: ["A rotação da Terra dura 25 horas nos anos pares", "A translação dura cerca de 365 dias e 6 horas, e as 6 horas somam um dia a cada 4 anos", "A Lua leva 366 dias para dar uma volta completa na Terra", "A Terra fica mais distante do Sol no afélio"], c: 1, h: "Some as horas que sobram em quatro anos. Quanto dá?", e: "As 6 horas excedentes somam 24 horas em 4 anos, acrescentadas como 29 de fevereiro. A rotação tem duração fixa de cerca de 24 horas." },
{ m: 28, q: "Quando é verão no Hemisfério Sul, no Hemisfério Norte é:", o: ["Verão também, pois a Terra toda recebe mais luz", "Inverno, porque os hemisférios recebem insolação diferente", "Outono, porque as estações são sempre deslocadas em uma", "Primavera, porque o eixo muda de inclinação a cada estação"], c: 1, h: "As estações são opostas entre os hemisférios. Se um está inclinado para o Sol, o outro está como?", e: "Quando um hemisfério está inclinado em direção ao Sol, o outro está inclinado para longe, então as estações são opostas. O eixo não muda de inclinação ao longo do ano." },
{ m: 28, q: "Em janeiro, a Terra está mais próxima do Sol, e é verão no Hemisfério Sul. Em julho, está mais distante, e é inverno no Hemisfério Sul. Apesar disso, os cientistas afirmam que a distância não causa as estações porque:", o: ["No mesmo momento, o Hemisfério Norte vive a estação oposta, o que a distância não explicaria", "A órbita da Terra é um círculo perfeito, sem afélio nem periélio", "O Sol emite mais energia quando a Terra está mais longe", "A atmosfera impede que a distância influencie a temperatura"], c: 0, h: "Se a distância fosse a causa, os dois hemisférios teriam a mesma estação ao mesmo tempo. Observe o que acontece de fato.", e: "A distância é a mesma para os dois hemisférios, mas as estações são opostas. Isso mostra que a causa é a inclinação do eixo, não a distância." },
{ m: 28, q: "O modelo que colocava a Terra imóvel no centro do Universo, com os astros girando ao seu redor, foi formalizado por:", o: ["Copérnico, no modelo heliocêntrico", "Ptolomeu, no modelo geocêntrico", "Newton, na lei da gravitação", "Eratóstenes, no cálculo da circunferência"], c: 1, h: "O nome do modelo vem do grego 'geo', que significa Terra.", e: "O geocentrismo foi formalizado por Ptolomeu no século II. Copérnico propôs o heliocentrismo, com o Sol no centro, em 1543." },
{ m: 28, q: "No Trópico de Capricórnio, no primeiro dia do verão do Hemisfério Sul, a sombra de um poste ao meio-dia é:", o: ["Muito longa, porque o Sol está baixo", "Praticamente um ponto, porque o Sol está quase na vertical", "Inexistente por seis meses", "Voltada sempre para o norte"], c: 1, h: "No primeiro dia do verão, o Sol fica na posição mais alta do ano naquela região. Se ele está quase em cima, o que acontece com a sombra?", e: "No solstício de verão, o Sol fica praticamente a pino sobre o Trópico de Capricórnio, e a sombra de um poste ao meio-dia se reduz a quase um ponto. O mesmo acontece no Trópico de Câncer no verão do Norte." }
];

const MODULE_NAMES = { 25: "Módulo 25", 26: "Módulo 26", 27: "Módulo 27", 28: "Módulo 28" };
const MODULES = [25, 26, 27, 28];

const state = {
screen: "quiz",
current: 0,
answers: Array(QUESTIONS.length).fill(null),
hintShown: Array(QUESTIONS.length).fill(false),
retakeIndexes: null
};

function activeIndexes() {
return state.retakeIndexes || QUESTIONS.map((_, i) => i);
}

function isCorrect(i) {
return state.answers[i] !== null && state.answers[i] === QUESTIONS[i].c;
}

function answeredCount() {
return state.answers.filter(a => a !== null).length;
}

function hitsCount() {
return activeIndexes().filter(i => isCorrect(i)).length;
}

function updateCounters() {
const answered = activeIndexes().filter(i => state.answers[i] !== null).length;
const hits = activeIndexes().filter(i => isCorrect(i)).length;
const a = document.getElementById("badgeAnswered");
const h = document.getElementById("badgeHits");
if (a) a.textContent = answered + " respondidas";
if (h) h.textContent = hits + " acertos";
}

function scrollTop() {
window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
const app = document.getElementById("app");
if (state.screen === "quiz") renderQuiz(app);
else if (state.screen === "result") renderResult(app);
else if (state.screen === "review") renderReview(app);
updateCounters();
}

function renderQuiz(app) {
const idxs = activeIndexes();
const pos = state.current;
const qi = idxs[pos];
const q = QUESTIONS[qi];
const answered = state.answers[qi] !== null;
const isLast = pos === idxs.length - 1;
const pct = (pos / idxs.length) * 100;
const hint = state.hintShown[qi];

let optionsHtml = q.o.map((opt, k) => {
let cls = "option-btn";
if (answered) {
if (k === q.c) cls += " correct";
else if (k === state.answers[qi]) cls += " wrong";
}
return `<button class="${cls}" data-choice="${k}" ${answered ? "disabled" : ""}>${escapeHtml(opt)}</button>`;
}).join("");

let feedback = "";
if (answered) {
const ok = state.answers[qi] === q.c;
feedback = `<div class="feedback-box ${ok ? "ok" : "no"} fade-in">
<strong>${ok ? "Correto!" : "Não foi dessa vez."}</strong>
<p>${escapeHtml(q.e)}</p>
</div>`;
}

app.innerHTML = `
<div class="quiz-card fade-in">
<div class="row between items-center">
<span class="module-tag">Módulo ${q.m}</span>
<span class="q-counter">Questão ${pos + 1} de ${idxs.length}</span>
</div>
<div class="progress-track" style="margin-top:8px"><div class="progress-fill" style="width:${pct}%"></div></div>
<h2 class="question-text">${escapeHtml(q.q)}</h2>
<div id="options">${optionsHtml}</div>
${hint && !answered ? `<div class="hint-box">💡 ${escapeHtml(q.h)}</div>` : ""}
${feedback}
<div class="quiz-footer">
<button class="btn" data-variant="ghost" id="btnHint" ${answered || hint ? "disabled" : ""}>💡 Precisa de uma dica?</button>
<button class="btn" id="btnNext" ${answered ? "" : "disabled"}>${isLast ? "Ver resultado" : "Próxima"}</button>
</div>
</div>`;

app.querySelectorAll(".option-btn").forEach(btn => {
btn.addEventListener("click", () => {
const choice = Number(btn.dataset.choice);
state.answers[qi] = choice;
render();
});
});

const hintBtn = document.getElementById("btnHint");
if (hintBtn) hintBtn.addEventListener("click", () => {
state.hintShown[qi] = true;
render();
});

const nextBtn = document.getElementById("btnNext");
if (nextBtn) nextBtn.addEventListener("click", () => {
if (isLast) {
state.screen = "result";
} else {
state.current++;
}
render();
scrollTop();
});
}

function message(pct) {
if (pct >= 85) return "Sensacional! Você dominou a matéria.";
if (pct >= 65) return "Muito bom! Você está preparada para a prova.";
if (pct >= 45) return "Bom esforço! Revise os módulos em que errou.";
return "Não desanime! Revise o material com calma e refaça o quiz.";
}

function moduleStats() {
const idxs = activeIndexes();
return MODULES.map(m => {
const qs = idxs.filter(i => QUESTIONS[i].m === m);
const hits = qs.filter(i => isCorrect(i)).length;
const total = qs.length;
const pct = total ? Math.round((hits / total) * 100) : 0;
return { m, hits, total, pct };
}).filter(s => s.total > 0);
}

function renderResult(app) {
const idxs = activeIndexes();
const hits = hitsCount();
const total = idxs.length;
const pct = Math.round((hits / total) * 100);
const stats = moduleStats();
const worst = stats.reduce((a, b) => (b.pct < a.pct ? b : a), stats[0]);
const wrongCount = idxs.filter(i => !isCorrect(i)).length;

const bars = stats.map(s => {
const cls = s.m === worst.m && s.pct < 65 ? "weak" : "good";
return `<div class="bar-block">
<div class="bar-head"><span>${MODULE_NAMES[s.m]}</span><span>${s.hits}/${s.total} · ${s.pct}%</span></div>
<div class="bar-track"><div class="bar-fill ${cls}" style="width:${s.pct}%"></div></div>
</div>`;
}).join("");

app.innerHTML = `
<div class="quiz-card fade-in">
<div class="hero-score">
<div class="hero-label">Seu desempenho</div>
<div class="big">${pct}%</div>
<p class="hero-caption">${hits} de ${total} acertos nesta rodada</p>
<p class="hero-message">${message(pct)}</p>
</div>
<h3 style="margin:22px 0 12px;color:#13344d">Desempenho por módulo</h3>
${bars}
<div class="attention-note">📌 Ponto de atenção: <strong>${MODULE_NAMES[worst.m]}</strong> teve o pior desempenho (${worst.pct}%). Reveja essas questões antes da prova.</div>
<div class="result-actions">
<button class="btn" id="btnReview">Revisar respostas</button>
<button class="btn" data-variant="secondary" id="btnRetryWrong" ${wrongCount === 0 ? "disabled" : ""}>Refazer só os erros (${wrongCount})</button>
<button class="btn" data-variant="outline" id="btnRetryAll">Refazer o quiz completo</button>
<button class="btn" data-variant="ghost" id="btnCopy">Copiar resultado</button>
</div>
</div>`;

document.getElementById("btnReview").addEventListener("click", () => { state.screen = "review"; render(); scrollTop(); });
const rw = document.getElementById("btnRetryWrong");
if (rw) rw.addEventListener("click", () => {
const wrong = activeIndexes().filter(i => !isCorrect(i));
resetFor(wrong);
window.skipUI.toast("Refazendo " + wrong.length + " questão(ões) que você errou.");
});
document.getElementById("btnRetryAll").addEventListener("click", () => {
resetFor(null);
window.skipUI.toast("Quiz reiniciado. Boa sorte!");
});
document.getElementById("btnCopy").addEventListener("click", () => copyResult(hits, total, pct, stats));
}

function resetFor(indexes) {
if (indexes) {
state.retakeIndexes = indexes;
indexes.forEach(i => { state.answers[i] = null; state.hintShown[i] = false; });
} else {
state.retakeIndexes = null;
state.answers = Array(QUESTIONS.length).fill(null);
state.hintShown = Array(QUESTIONS.length).fill(false);
}
state.current = 0;
state.screen = "quiz";
render();
scrollTop();
}

function copyResult(hits, total, pct, stats) {
const lines = [
"Desafio de Ciências — 6º Ano",
`Resultado: ${hits} de ${total} acertos (${pct}%)`,
...stats.map(s => `${MODULE_NAMES[s.m]}: ${s.hits}/${s.total} (${s.pct}%)`),
message(pct)
].join("\n");
if (!navigator.clipboard) {
window.skipUI.toast("Não foi possível copiar neste navegador.", { type: "error" });
return;
}
navigator.clipboard.writeText(lines).then(
() => window.skipUI.toast("Resultado copiado!", { type: "success" }),
() => window.skipUI.toast("Não foi possível copiar o resultado.", { type: "error" })
);
}

function renderReview(app) {
const wrong = activeIndexes().filter(i => !isCorrect(i));
const items = wrong.map(i => {
const q = QUESTIONS[i];
const mine = state.answers[i];
const yours = (mine === null || mine === undefined) ? "Não respondida" : q.o[mine];
return `<div class="review-item">
<span class="module-tag">Módulo ${q.m}</span>
<p><strong>${escapeHtml(q.q)}</strong></p>
<p>❌ <strong>Sua resposta:</strong> ${escapeHtml(yours)}</p>
<p>✅ <strong>Resposta correta:</strong> ${escapeHtml(q.o[q.c])}</p>
<p><strong>Explicação:</strong> ${escapeHtml(q.e)}</p>
</div>`;
}).join("");

app.innerHTML = `
<div class="quiz-card fade-in">
<h2 style="margin:0 0 6px;color:#13344d">Revisão das respostas</h2>
<p class="app-subtitle">${wrong.length === 0 ? "Você não errou nenhuma questão desta rodada." : "Veja o que marcou, a resposta correta e a explicação de cada erro."}</p>
<div style="margin-top:18px">${items}</div>
<div class="result-actions">
<button class="btn" data-variant="outline" id="btnBackResult">Voltar ao resultado</button>
</div>
</div>`;
document.getElementById("btnBackResult").addEventListener("click", () => { state.screen = "result"; render(); scrollTop(); });
}

function escapeHtml(str) {
return String(str).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
